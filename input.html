<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Input Data - Helixon</title>
</head>

<body style="background:#020617; color:white; font-family:Arial;">

  <div style="max-width:600px; margin:60px auto; padding:30px; background:#020617; border:1px solid #1e293b; border-radius:10px;">
    
    <h2 style="margin-bottom:20px;">Input Energy Data</h2>

    <form id="energy-form" style="display:flex; flex-direction:column; gap:12px;">

      <select id="facility_id" required style="padding:10px; border-radius:6px;">
        <option value="">Select Facility</option>
        <option value="Plant A">Plant A</option>
        <option value="Plant B">Plant B</option>
      </select>

      <select id="energy_type" required style="padding:10px; border-radius:6px;">
        <option value="">Energy Type</option>
        <option value="electricity">Electricity</option>
        <option value="diesel">Diesel</option>
        <option value="coal">Coal</option>
        <option value="gas">Gas</option>
      </select>

      <input type="month" id="month" required style="padding:10px; border-radius:6px;">

      <input type="number" id="total_cost" placeholder="Total Cost ($)" required style="padding:10px; border-radius:6px;">

      <button type="submit" style="background:#3b82f6; color:white; padding:10px; border:none; border-radius:6px; cursor:pointer;">
        Save Data
      </button>

    </form>

    <button onclick="window.location.href='index.html'" 
    style="margin-top:15px; background:#334155; color:white; padding:8px 12px; border:none; border-radius:6px; cursor:pointer;">
      Back to Dashboard
    </button>

  </div>

  <script type="module" src="./js/input.js"></script>

</body>
</html>
