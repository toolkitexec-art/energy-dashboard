<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helixon Energy Intelligence</title>
<link rel="stylesheet" href="style.css">

<style>
/* 🔹 LOGOUT BUTTON STYLING */
#logout-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #334155;
    background: linear-gradient(135deg,#3b82f6,#1e3a8a);
    color: white;
    font-weight: 600;
    cursor: pointer;
    z-index: 999;
    font-size: 0.875rem;
    transition: transform 0.1s, box-shadow 0.1s;
}
#logout-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* 🔹 DASHBOARD BODY */
body {
    background:
        radial-gradient(circle at 20% 10%,#1e293b 0%,transparent 40%),
        radial-gradient(circle at 90% 90%,#1e3a8a 0%,transparent 40%),
        #020617;
    color:#e5e7eb;
    font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,sans-serif;
    margin: 40px;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}
.filters {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}
.analytics-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 20px;
    margin-bottom: 30px;
}
.kpi-card {
    min-height: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px;
    font-weight: 600;
}
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
    margin-bottom: 20px;
}
/* Charts */
.page.chart-page img {
    width: 100%;
    max-width: 100%;
    height: auto;
}
</style>

</head>
<body>

<!-- 🔹 LOGOUT BUTTON -->
<button id="logout-btn">Logout</button>    

<!-- HEADER -->
<div class="header">
    <img src="logo-helixon.png" alt="Helixon Logo" height="40">
    <h1>Helixon Energy Intelligence</h1>
</div>

<!-- FILTER -->
<div class="filters">
    <select id="facility-select">
        <option value="all">All Facilities</option>
    </select>

    <select id="month-select">
        <option value="all">All Months</option>
    </select>
</div>

<!-- KPI -->
<div id="kpi-container" class="kpi-grid"></div>

<!-- ANALYTICS GRID -->
<div class="analytics-grid">
    <div class="analytics-card">
        <div>Industry Benchmark</div>
        <div id="benchmark-value"></div>
    </div>

    <div class="analytics-card">
        <div>Energy Efficiency Score</div>
        <div id="efficiency-score"></div>
    </div>

    <div class="analytics-card">
        <div>Emission Reduction Potential</div>
        <div id="reduction-ai"></div>
    </div>

    <div class="analytics-card">
        <div>Cost Saving Opportunity</div>
        <div id="saving-ai"></div>
    </div>
</div>

<!-- ENERGY TYPE -->
<h3>Energy Type Comparison</h3>
<div id="energy-total" class="energy-total"></div>
<canvas id="stackedChart"></canvas>

<!-- TREND -->
<h3>Emission Trend</h3>
<canvas id="trendChart"></canvas>

<!-- FACILITY -->
<h3>Facility Comparison</h3>
<canvas id="facilityChart"></canvas>

<!-- 🔹 LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<!-- 🔹 DASHBOARD SCRIPT -->
<script src="script.js" type="module"></script>

<!-- 🔹 EXPORT PDF -->
<script src="export.js"></script>

<script type="module">
// 🔹 SUPABASE CLIENT
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
const SUPABASE_URL="https://otzxkvdkpbsyrbiqtbjd.supabase.co";
const SUPABASE_KEY="sb_publishable_r5rzVpoDYvd3TkrseKi4jw_QnE-Ekvx";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

// 🔹 CEK SESSION, REDIRECT KE LOGIN JIKA TIDAK ADA
async function init(){
    const { data, error } = await supabase.auth.getSession();
    if(error || !data?.session){
        window.location.href = "login.html";
        return;
    }
}
init();

// 🔹 LOGOUT BIND
const logoutBtn = document.getElementById("logout-btn");
if(logoutBtn){
    logoutBtn.addEventListener("click", async ()=>{
        await supabase.auth.signOut();
        window.location.href = "login.html";
    });
}
</script>

</body>
    </html>
