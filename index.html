<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helixon Energy Intelligence</title>
<link rel="stylesheet" href="style.css">
  <!-- TAMBAHKAN INI DI SINI -->
    <style id="force-print">
        @media print {
            * {
                color: black !important;
                background: white !important;
            }
        }
    </style>
    
</head>
<body>

<!-- HEADER -->
<div class="header">
    <img src="logo-helixon.png" alt="Helixon Logo">
    <h1>Helixon Energy Intelligence</h1>
</div>

 <!-- LOGOUT BUTTON -->
<button id="logout-btn" 
style="position:absolute; top:35px; right:150px; background:red; color:white; padding:6px 12px; border:none; border-radius:4px; cursor:pointer;">
Logout
</button>
   
<!-- FILTER -->
<div class="filters">
    <select id="facility-select">
        <option value="all">All Facilities</option>
    </select>

    <select id="month-select">
        <option value="all">All Months</option>
    </select>
</div>

<!-- KPI -->
<div id="kpi-container"></div>

<!-- ANALYTICS GRID -->
<div class="analytics-grid">
    <div class="analytics-card">
        <div>Industry Benchmark</div>
        <div id="benchmark-value"></div>
    </div>

    <div class="analytics-card">
        <div>Energy Efficiency Score</div>
        <div id="efficiency-score"></div>
    </div>

    <div class="analytics-card">
        <div>Emission Reduction Potential</div>
        <div id="reduction-ai"></div>
    </div>

    <div class="analytics-card">
        <div>Cost Saving Opportunity</div>
        <div id="saving-ai"></div>
    </div>
</div>

<!-- ENERGY TYPE -->
<h3>Energy Type Comparison</h3>
<div id="energy-total" class="energy-total"></div>
<canvas id="stackedChart"></canvas>

<!-- TREND -->
<h3>Emission Trend</h3>
<canvas id="trendChart"></canvas>

<!-- FACILITY -->
<h3>Facility Comparison</h3>
<canvas id="facilityChart"></canvas>

<!-- LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

  <!-- PDF EXPORT LIBRARY (WAJIB DI INDEX.HTML) -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<!-- ADD INI -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <!-- DASHBOARD SCRIPT -->
<script src="script.js" type="module"></script>

<!-- EXPORT PDF -->
<script src="export.js"></script>

</body>
</html>
