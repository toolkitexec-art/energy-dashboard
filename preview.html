<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Helixon Report Preview</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
background:#020617;
font-family:Inter,Arial;
margin:0;
padding:40px;
color:#e5e7eb;
}

#preview{
max-width:1000px;
margin:auto;
display:flex;
flex-direction:column;
gap:40px;
}

.page{
background:white;
color:black;
width:1000px;
min-height:1400px;
padding:50px;
border-radius:10px;
box-shadow:0 15px 60px rgba(0,0,0,.5);
}

.report-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.report-title{
font-size:22px;
font-weight:600;
}

.report-date{
font-size:14px;
color:#555;
}

.section-title{
margin-top:30px;
margin-bottom:10px;
font-weight:600;
font-size:16px;
}

.chart-img{
width:100%;
margin-top:10px;
}

.download-btn{
position:fixed;
top:30px;
right:40px;
background:#2563eb;
border:none;
color:white;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

</style>

</head>

<body>

<button class="download-btn" onclick="downloadPDF()">Download PDF</button>

<div id="preview"></div>

<script>

const data=JSON.parse(localStorage.getItem("helixon_report"))

const container=document.getElementById("preview")

/* PAGE 1 */

const page1=document.createElement("div")
page1.className="page"

page1.innerHTML=`

<div class="report-header">

<div class="report-title">
Helixon Carbon Report
</div>

<div class="report-date">
${data.date}
</div>

</div>

<div class="section-title">
KPI Overview
</div>

${data.kpi}

<div class="section-title">
Energy Type Comparison
</div>

<img class="chart-img" src="${data.energyChart}">
`

container.appendChild(page1)

/* PAGE 2 */

const page2=document.createElement("div")
page2.className="page"

page2.innerHTML=`

<div class="report-header">

<div class="report-title">
Emission Trend
</div>

<div class="report-date">
${data.date}
</div>

</div>

<img class="chart-img" src="${data.emissionChart}">

`

container.appendChild(page2)

/* PAGE 3 */

const page3=document.createElement("div")
page3.className="page"

page3.innerHTML=`

<div class="report-header">

<div class="report-title">
Facility Comparison
</div>

<div class="report-date">
${data.date}
</div>

</div>

<img class="chart-img" src="${data.facilityChart}">

`

container.appendChild(page3)



async function downloadPDF(){

const { jsPDF } = window.jspdf

const pdf=new jsPDF("p","pt","a4")

const pages=document.querySelectorAll(".page")

for(let i=0;i<pages.length;i++){

const canvas=await html2canvas(pages[i])

const img=canvas.toDataURL("image/png")

const width=595
const height=canvas.height*width/canvas.width

if(i>0) pdf.addPage()

pdf.addImage(img,"PNG",0,0,width,height)

}

pdf.save("helixon-carbon-report.pdf")

}

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
