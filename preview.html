<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Helixon Report Preview</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
background:#020617;
color:#e5e7eb;
font-family:Inter, sans-serif;
padding:40px;
}

#download{
position:fixed;
top:30px;
right:40px;
padding:10px 16px;
border-radius:10px;
border:1px solid #334155;
background:linear-gradient(135deg,#3b82f6,#1e3a8a);
color:white;
font-weight:600;
cursor:pointer;
z-index:999;
}

.page{
background:white;
color:black;
width:794px;
margin:auto;
margin-bottom:40px;
padding:40px;
box-sizing:border-box;
}

.page img{
width:100%;
}

.kpi-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:30px;
}

.analytics-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:20px;
margin-bottom:30px;
}  
  
</style>

</head>

<body>

<button id="download">Download PDF</button>

<div id="report"></div>

<script>

const data = JSON.parse(localStorage.getItem("helixon_report"))

const report = document.getElementById("report")

report.innerHTML = `

<div id="pdf-content">

<div class="page">

<h2>Helixon Energy Intelligence Report</h2>

<p>
Report Date: ${data.date}<br>
Facility Filter: ${data.facility}<br>
Month Filter: ${data.month}
</p>

<div class="kpi-grid">
${data.kpi}
</div>

<div class="analytics-grid">
${data.analytics}
</div>

<h3>Energy Type Comparison</h3>
<img src="${data.charts.energy}">

</div>


<div class="page">

<h3>Emission Trend</h3>
<img src="${data.charts.trend}">

</div>


<div class="page">

<h3>Facility Comparison</h3>
<img src="${data.charts.facility}">

</div>

</div>

`

document.getElementById("download").onclick = () => {

html2pdf().set({
margin:0.4,
filename:"helixon-energy-report.pdf",
image:{type:"jpeg",quality:1},
html2canvas:{scale:2},
jsPDF:{unit:"in",format:"a4",orientation:"portrait"}
}).from(document.getElementById("pdf-content")).save()

}

</script>

</body>
</html>
