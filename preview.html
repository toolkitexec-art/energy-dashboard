<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>PDF Preview</title>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>

body{
background:#020617;
color:white;
font-family:Arial;
margin:40px;
}

.page{
background:white;
color:black;
width:800px;
margin:auto;
margin-bottom:40px;
padding:40px;
}

.chart{
width:100%;
margin-top:20px;
}

.download{
position:fixed;
top:30px;
right:40px;
padding:10px 16px;
background:#2563eb;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<button class="download" onclick="downloadPDF()">Download PDF</button>

<div id="preview"></div>

<script>

const charts = JSON.parse(localStorage.getItem("helixonCharts"));

const preview = document.getElementById("preview");


/* PAGE 1 */

const page1 = document.createElement("div");
page1.className="page";

page1.innerHTML = `
<h2>Energy Type Comparison</h2>
<img class="chart" src="${charts[0]}">
`;

preview.appendChild(page1);


/* PAGE 2 */

const page2 = document.createElement("div");
page2.className="page";

page2.innerHTML = `
<h2>Emission Trend</h2>
<img class="chart" src="${charts[1]}">
`;

preview.appendChild(page2);


/* PAGE 3 */

const page3 = document.createElement("div");
page3.className="page";

page3.innerHTML = `
<h2>Facility Comparison</h2>
<img class="chart" src="${charts[2]}">
`;

preview.appendChild(page3);



async function downloadPDF(){

const { jsPDF } = window.jspdf;

const pdf = new jsPDF("p","mm","a4");

const pages = document.querySelectorAll(".page");

let first = true;

for(let page of pages){

const canvas = await html2canvas(page,{scale:2});

const img = canvas.toDataURL("image/png");

const width = 210;
const height = canvas.height * width / canvas.width;

if(!first) pdf.addPage();
first=false;

pdf.addImage(img,"PNG",0,0,width,height);

}

pdf.save("helixon-report.pdf");

}

</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
