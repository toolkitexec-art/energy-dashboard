<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Helixon Report Preview</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    background:#020617;
    font-family:Inter, sans-serif;
    padding:40px;
}

/* BUTTON */
#download{
    position:fixed;
    top:30px;
    right:40px;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid #334155;
    background:linear-gradient(135deg,#3b82f6,#1e3a8a);
    color:white;
    font-weight:600;
    cursor:pointer;
    z-index:999;
}

/* =========================
PDF CONTAINER (FORCE CLEAN)
========================= */
#pdf-content{
    background:white;
    color:black;
}

/* RESET DARK UI */
#pdf-content *{
    background:white !important;
    color:black !important;
    box-shadow:none !important;
}

/* PAGE */
.page{
    min-height:1123px;
    width:794px;
    margin:auto;
    margin-bottom:40px;
    padding:40px;
    box-sizing:border-box;
    flex-direction:column;       /* ðŸ”¥ */
    justify-content:center;      /* ðŸ”¥ CENTER VERTICAL */
    align-items:center; 
    page-break-inside: avoid;
}

/* LAST PAGE */
.page:last-child{
    page-break-after:auto;
}

/* HEADER */
.page h2{
    margin-bottom:20px;
}

.page p{
    margin-bottom:20px;
    line-height:1.5;
}

    .page h3{
    margin-bottom:20px;
}
    
/* GRID */
.kpi-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.analytics-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:20px;
}

/* CARD */
.kpi-card,
.analytics-card{
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
}

/* CHART PAGE */
.chart-page{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.chart-page h3{
    margin-bottom:20px;
    margin-bottom:20px;
    text-align:center;
}

/* IMAGE */
.page img{
    width:100%;
    max-width:700px;
    height:auto;
}
</style>

</head>
<body>

<button id="download">Download PDF</button>

<div id="report"></div>

<script>
/* =========================
GET DATA
========================= */
const raw = localStorage.getItem("helixonCharts");

if(!raw){
    document.body.innerHTML = "<h2 style='color:white'>No report data</h2>";
    throw new Error("NO DATA");
}

const data = JSON.parse(raw);

/* =========================
RENDER
========================= */
const report = document.getElementById("report");

report.innerHTML = `
<div id="pdf-content">

<div class="page">
<h2>Helixon Energy Intelligence Report</h2>

<p>
Report Date: ${data.date}<br>
Facility Filter: ${data.facility}<br>
Month Filter: ${data.month}
</p>

<div class="kpi-grid">
${data.kpi || ""}
</div>

<div class="analytics-grid">
${data.analytics || ""}
</div>

<h3>Energy Type Comparison</h3>
${data.charts.energy ? `<img src="${data.charts.energy}">` : "<p>No chart</p>"}
</div>

<div class="page chart-page">
<h3>Emission Trend</h3>
${data.charts.trend ? `<img src="${data.charts.trend}">` : "<p>No chart</p>"}
</div>

<div class="page chart-page">
<h3>Facility Comparison</h3>
${data.charts.facility ? `<img src="${data.charts.facility}">` : "<p>No chart</p>"}
</div>

</div>
`;

/* =========================
DOWNLOAD PDF
========================= */
document.getElementById("download").onclick = () => {

    const el = document.getElementById("pdf-content");

    if(!el || el.innerHTML.trim() === ""){
        alert("PDF content empty");
        return;
    }

    html2pdf().set({
        margin:[10,10,10,10],
        filename:"helixon-energy-report.pdf",
        image:{type:"png",quality:1},
        html2canvas:{
            scale:3,
            dpi:300,
            useCORS:true,
            width:794,
            letterRendering:true
        },
        jsPDF:{
            unit:"px",
            format:[794,1123],
            orientation:"portrait"
        },
        pagebreak:{mode:["css","legacy"]}
    }).from(el).save();
};
</script>

</body>
</html>
