<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Helixon Report Preview</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    background:#020617;
    font-family:Inter, sans-serif;
    padding:40px;
}

/* BUTTON */
#download{
    position:fixed;
    top:30px;
    right:40px;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid #334155;
    background:linear-gradient(135deg,#3b82f6,#1e3a8a);
    color:white;
    font-weight:600;
    cursor:pointer;
    z-index:999;
}

/* STRICT PDF ROOT */
#pdf-content{
    background:white;
    color:black;
}

/* HARD RESET (NO DARK INHERIT) */
#pdf-content *{
    background:white !important;
    color:black !important;
    box-shadow:none !important;
}

/* PAGE */
.page{
    width:794px;
    min-height:1123px;
    margin:auto;
    margin-bottom:40px;
    padding:40px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    page-break-inside: avoid;
}

/* TEXT */
.page h2, .page h3, .page p{
    margin:10px 0;
    text-align:center;
}

/* GRID */
.kpi-grid, .analytics-grid{
    width:100%;
    display:grid;
    gap:12px;
    margin:20px 0;
}

.kpi-grid{
    grid-template-columns:repeat(3,1fr);
}

.analytics-grid{
    grid-template-columns:repeat(2,1fr);
}

/* CARD */
.kpi-card, .analytics-card{
    border:1px solid #ccc;
    border-radius:8px;
    padding:12px;
}

/* CHART */
.page img{
    width:100%;
    max-width:700px;
    height:auto;
}
</style>

</head>
<body>

<button id="download">Download PDF</button>

<div id="report"></div>

<script>
/* =========================
  SINGLE SOURCE LOCK
========================= */
const raw = localStorage.getItem("helixonCharts");

if(!raw){
    document.body.innerHTML = "<h2 style='color:white'>NO EXPORT DATA</h2>";
    throw new Error("NO DATA");
}

const data = JSON.parse(raw);

/* STRICT VALIDATION (NO FALLBACK ASSUMPTION) */
if(!data.meta || !data.charts){
    document.body.innerHTML = "<h2 style='color:white'>INVALID EXPORT STRUCTURE</h2>";
    throw new Error("INVALID STRUCTURE");
}

/* =========================
  RENDER ONLY FROM PAYLOAD
========================= */
const report = document.getElementById("report");

report.innerHTML = `
<div id="pdf-content">

    <div class="page">
        <h2>Helixon Energy Intelligence Report</h2>

        <p>
            Report Date: ${data.meta.date}<br>
            Facility Filter: ${data.meta.facility}<br>
            Month Filter: ${data.meta.month}
        </p>

        <div class="kpi-grid">
            ${data.kpi}
        </div>

        <div class="analytics-grid">
            ${data.analytics}
        </div>

<div class="page">
    <h3>Energy Type Comparison</h3>

    <div class="kpi-card" style="margin-bottom:15px;">
        Energy Total: ${data.energyTotal}
    </div>

    ${data.charts.energy 
        ? `<img src="${data.charts.energy}">` 
        : "<p>NO CHART DATA</p>"
    }
</div> 

    <div class="page">
        <h3>Emission Trend</h3>
        ${data.charts.trend ? `<img src="${data.charts.trend}">` : "<p>NO CHART DATA</p>"}
    </div>

    <div class="page">
        <h3>Facility Comparison</h3>
        ${data.charts.facility ? `<img src="${data.charts.facility}">` : "<p>NO CHART DATA</p>"}
    </div>

</div>
`;

/* =========================
  PDF EXPORT (STRICT)
========================= */
document.getElementById("download").onclick = () => {

    const el = document.getElementById("pdf-content");

    if(!el){
        alert("EMPTY EXPORT");
        return;
    }

    html2pdf().set({
        margin:[10,10,10,10],
        filename:"helixon-energy-report.pdf",
        image:{type:"png", quality:1},
        html2canvas:{
            scale:3,
            useCORS:true,
            width:794,
            letterRendering:true
        },
        jsPDF:{
            unit:"px",
            format:[794,1123],
            orientation:"portrait"
        },
        pagebreak:{mode:["css","legacy"]}
    }).from(el).save();
};

</script>

</body>
</html>
